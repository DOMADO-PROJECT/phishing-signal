<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">피싱 신호등 — 의심되면, 먼저 확인.</title>
  <desc id="desc">받은 문자·메신저의 위험 신호부터 다음 행동까지 안내합니다. 연락은 내 브라우저에서 분석하며 Safe 이후에도 행동 요구를 확인합니다. 신호등은 판정 결과가 아닌 브랜드 심벌입니다. 사이트 로고와 같은 단색 심벌이 처음에 360도 한 번 회전한 뒤 부드럽게 떠오릅니다. 세 원의 기본 색은 유지하며, 빨강·노랑·초록 순서로 렌즈 전체가 같은 색 계열로 밝아지고 흰 프레임에 옅은 반사광이 생깁니다. 각 색은 1.25초 동안 부드럽게 켜져 잠시 유지된 뒤 꺼지고 0.25초 쉬며, 4.5초 주기로 반복합니다. 문구는 고정하며 모션 감소 설정에서는 움직임과 점멸 없이 로고를 표시합니다.</desc>
  <defs>
    <radialGradient id="red-spill"><stop offset=".55" stop-color="#F04438" stop-opacity=".28"/><stop offset=".8" stop-color="#F04438" stop-opacity=".06"/><stop offset="1" stop-color="#F04438" stop-opacity="0"/></radialGradient>
    <radialGradient id="amber-spill"><stop offset=".55" stop-color="#FF9500" stop-opacity=".28"/><stop offset=".8" stop-color="#FF9500" stop-opacity=".06"/><stop offset="1" stop-color="#FF9500" stop-opacity="0"/></radialGradient>
    <radialGradient id="green-spill"><stop offset=".55" stop-color="#12B76A" stop-opacity=".28"/><stop offset=".8" stop-color="#12B76A" stop-opacity=".06"/><stop offset="1" stop-color="#12B76A" stop-opacity="0"/></radialGradient>
    <clipPath id="frame-clip"><rect x="31.67" y="15.42" width="36.66" height="69.16" rx="18.33"/></clipPath>
    <filter id="shadow" x="-30%" y="-150%" width="160%" height="400%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <g id="signal">
      <ellipse class="hero-shadow" cx="50" cy="112" rx="34" ry="3" fill="#101828" opacity=".11" filter="url(#shadow)"/>
      <g class="hero-mark">
        <g class="hero-spin">
          <rect width="100" height="100" rx="23" fill="#101A2B"/>
          <rect x="31.67" y="15.42" width="36.66" height="69.16" rx="18.33" fill="#FFF"/>
          <g clip-path="url(#frame-clip)">
            <circle class="light light-red" cx="50" cy="33.33" r="14" fill="url(#red-spill)"/>
            <circle class="light light-amber" cx="50" cy="50" r="14" fill="url(#amber-spill)"/>
            <circle class="light light-green" cx="50" cy="66.67" r="14" fill="url(#green-spill)"/>
          </g>
          <circle class="lens lens-red" cx="50" cy="33.33" r="8.33" fill="#F04438"/>
          <circle class="lens lens-amber" cx="50" cy="50" r="8.33" fill="#FF9500"/>
          <circle class="lens lens-green" cx="50" cy="66.67" r="8.33" fill="#12B76A"/>
        </g>
      </g>
    </g>
  </defs>
  <style>
    text{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;letter-spacing:-.35px}
    .numeric{font-variant-numeric:tabular-nums;letter-spacing:-1px}
    .hero-mark,.hero-spin,.hero-shadow{transform-box:fill-box;transform-origin:center}
    .light{opacity:0}
    @media(prefers-reduced-motion:no-preference){
      .hero-mark{animation:float 8s ease-in-out infinite}
      .hero-spin{animation:intro-spin 1.8s cubic-bezier(.22,.61,.36,1) 1}
      .hero-shadow{animation:shadow-breathe 8s ease-in-out infinite}
      .lens-red{animation:red-lens 4.5s cubic-bezier(.333333,0,.666667,1) 1.8s infinite}
      .light-red{animation:red-light 4.5s cubic-bezier(.333333,0,.666667,1) 1.8s infinite}
      .lens-amber{animation:amber-lens 4.5s cubic-bezier(.333333,0,.666667,1) 1.8s infinite}
      .light-amber{animation:amber-light 4.5s cubic-bezier(.333333,0,.666667,1) 1.8s infinite}
      .lens-green{animation:green-lens 4.5s cubic-bezier(.333333,0,.666667,1) 1.8s infinite}
      .light-green{animation:green-light 4.5s cubic-bezier(.333333,0,.666667,1) 1.8s infinite}
    }
    @keyframes intro-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes shadow-breathe{0%,100%{opacity:.11;transform:scaleX(1)}50%{opacity:.07;transform:scaleX(.9)}}
    @keyframes red-lens{0%,27.777778%,100%{fill:#F04438}5%,18.055556%{fill:#FFA477}}
    @keyframes red-light{0%,27.777778%,100%{opacity:0}5%,18.055556%{opacity:1}}
    @keyframes amber-lens{0%,33.333333%,61.111111%,100%{fill:#FF9500}38.333333%,51.388889%{fill:#F9EBAE}}
    @keyframes amber-light{0%,33.333333%,61.111111%,100%{opacity:0}38.333333%,51.388889%{opacity:1}}
    @keyframes green-lens{0%,66.666667%,94.444444%,100%{fill:#12B76A}71.666667%,84.722222%{fill:#CAF0D8}}
    @keyframes green-light{0%,66.666667%,94.444444%,100%{opacity:0}71.666667%,84.722222%{opacity:1}}
  </style>
  <rect width="1280" height="540" rx="14" fill="#FFF"/>
  <g id="diagram-header">
    <g transform="translate(40 25) scale(1)" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#101828"/><rect x="11" y="5" width="10" height="22" rx="5" fill="#FFF"/><circle cx="16" cy="10" r="2.7" fill="#F04438"/><circle cx="16" cy="16" r="2.7" fill="#FFAB16"/><circle cx="16" cy="22" r="2.7" fill="#19B980"/></g>
    <text id="header-brand" x="86" y="53" font-size="28" fill="#101828" font-weight="750">피싱 신호등</text>
    <text id="header-page" x="250" y="51" font-size="16" fill="#2563D9" font-weight="650" style="letter-spacing:1px">OVERVIEW</text>
    <text id="header-detail" x="1240" y="51" font-size="16" fill="#596779" text-anchor="end">의심과 행동 사이, 피싱 신호등</text>
    <path d="M40 80H1240" fill="none" stroke="#E3E8EF" stroke-width="1"/>
  </g>
  <text x="64" y="225" font-size="76" fill="#101828" font-weight="750" >의심되면,</text>
  <text x="64" y="319" font-size="76" fill="#2563D9" font-weight="750" >먼저 확인.</text>
  <text x="68" y="388" font-size="25" fill="#596779" font-weight="400" >받은 연락의 위험 신호부터, 지금 해야 할 일까지.</text>
  <text x="68" y="437" font-size="20" fill="#596779" font-weight="400" >내 브라우저에서 분석 · Safe 이후에도 행동 확인</text>
  <g transform="translate(895 143) scale(2.55)" aria-hidden="true"><use href="#signal"/></g>
</svg>
