<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">모르겠어요 — 모델 라벨과 별도로 다음 행동 안내</title>
  <desc id="desc">배송 안내 합성 예시의 행동 확인을 설명하는 도식입니다. 최종 Safe이고 피해 상황이 없을 때 송금·정보 전달·앱 또는 기기 접근을 요구받았는지 묻습니다. 모르겠어요를 선택하면 행동을 보류하고 알고 있던 공식 경로에서 확인하도록 안내합니다. 답변은 모델 라벨을 바꾸지 않습니다. 선택 테두리, 연결선, 결과 테두리만 순서대로 강조하며 본문은 움직이지 않습니다. 실제 분석 화면이나 실시간 결과가 아닙니다. 모션 감소 시 정적으로 표시합니다.</desc>
  <defs></defs>
  <style>
    text{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;letter-spacing:-.35px}
    .numeric{font-variant-numeric:tabular-nums;letter-spacing:-1px}
    .step-focus,.wire-motion,.focus-ring{opacity:0}
    .wire-motion{transform-box:fill-box;transform-origin:left center}
    .vertical{transform-origin:center top}.vertical.reverse-y{transform-origin:center bottom}.reverse{transform-origin:right center}
    @media(prefers-reduced-motion:no-preference){
      .step-focus,.focus-ring{animation:focus 10s linear infinite both;animation-delay:var(--delay,0s)}
      .wire-motion{animation:connect 10s linear infinite both;animation-delay:var(--delay,0s)}
      .wire-motion.vertical{animation-name:connect-down}
    }
    @keyframes focus{0%,2%,25%,100%{opacity:0}6%,20%{opacity:1}}
    @keyframes connect{0%{opacity:0;transform:scaleX(.04)}1%{opacity:1}10%,14%{opacity:1;transform:scaleX(1)}18%,100%{opacity:0;transform:scaleX(1)}}
    @keyframes connect-down{0%{opacity:0;transform:scaleY(.04)}1%{opacity:1}10%,14%{opacity:1;transform:scaleY(1)}18%,100%{opacity:0;transform:scaleY(1)}}
  </style>
  <rect x="1" y="1" width="1278" height="638" rx="14" fill="#FFF" stroke="#E3E8EF"/>
  <g transform="translate(40 25) scale(1)" aria-hidden="true"><rect x="0" y="0" width="32" height="32" rx="8" fill="#101828" /><rect x="11" y="5" width="10" height="22" rx="5" fill="#FFF" /><circle cx="16" cy="10" r="2.7" fill="#F04438"/><circle cx="16" cy="16" r="2.7" fill="#FFAB16"/><circle cx="16" cy="22" r="2.7" fill="#19B980"/></g>
  <text x="86" y="49" font-size="24" fill="#101828" font-weight="750" >피싱 신호등</text>
  <text x="1240" y="46" font-size="15" fill="#596779" font-weight="550" text-anchor="end" letter-spacing=".8">ACTION CHECK</text>
  <path d="M40 76H1240" fill="none" stroke="#E3E8EF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <text x="40" y="148" font-size="40" fill="#101828" font-weight="750" >모르겠다면, 행동을 잠시 멈춥니다.</text>
  <text x="40" y="190" font-size="23" fill="#596779" font-weight="400" >최종 Safe · 피해 상황이 없는 배송 안내 예시</text>
  <rect x="40" y="237" width="560" height="245" rx="12" fill="#F5F8FC" />
  <text x="68" y="282" font-size="26" fill="#101828" font-weight="650" >상대가 이런 행동을 하라고 했나요?</text>
  <text x="68" y="323" font-size="22" fill="#596779" font-weight="400" >송금 · 정보 전달 · 앱/기기 접근</text>
  <rect x="68" y="367" width="112" height="60" rx="10" fill="#E7EDF4" />
  <rect x="192" y="367" width="112" height="60" rx="10" fill="#E7EDF4" />
  <rect x="316" y="367" width="256" height="60" rx="10" fill="#101828" />
  <rect x="316" y="367" width="256" height="60" rx="10" fill="none" class="focus-ring" stroke="#2563D9" stroke-width="3" aria-hidden="true"/>
  <text x="124" y="406" font-size="22" fill="#596779" font-weight="500" text-anchor="middle">있어요</text>
  <text x="248" y="406" font-size="22" fill="#596779" font-weight="500" text-anchor="middle">없어요</text>
  <text x="444" y="406" font-size="23" fill="#FFF" font-weight="650" text-anchor="middle">모르겠어요</text>
  <path d="M612 360L668 360" fill="none" stroke="#AAB7C7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M661 355L668 360L661 365" fill="none" stroke="#AAB7C7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="612" y="359" width="56" height="2" rx="0" fill="#2563D9" class="wire-motion" style="--delay:1.6s" aria-hidden="true"/>
  <rect x="680" y="237" width="560" height="245" rx="12" fill="#FFF8E8" stroke="#EFDEB6"/>
  <rect x="680" y="237" width="560" height="245" rx="12" fill="none" class="focus-ring" style="--delay:3s" stroke="#B17D1B" stroke-width="2" aria-hidden="true"/>
  <text x="708" y="278" font-size="20" fill="#8C600B" font-weight="600" >다음 행동</text>
  <text x="708" y="326" font-size="32" fill="#101828" font-weight="650" >행동을 보류하고</text>
  <text x="708" y="368" font-size="32" fill="#101828" font-weight="650" >공식 경로로 확인</text>
  <text x="708" y="428" font-size="22" fill="#596779" font-weight="400" >송금·정보 전달·앱 설치를 잠시 멈춥니다.</text>
  <path d="M40 530H1240" fill="none" stroke="#E3E8EF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <text x="40" y="573" font-size="22" fill="#596779" font-weight="400" >답변은 다음 행동을 안내하며, 모델 라벨을 바꾸지 않습니다.</text>
  <text x="40" y="609" font-size="19" fill="#596779" font-weight="400" >설명용 도식 · 실제 운영 화면은 아래 시연 캡처에서 확인할 수 있습니다.</text>
</svg>
