      .score-reveal{animation:score-settle .65s cubic-bezier(.23,1,.32,1) both;animation-delay:3.45s}
    }
    @keyframes selection-fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes score-settle{from{opacity:.45;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  </style>
