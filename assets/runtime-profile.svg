<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1290" viewBox="0 0 1280 1290" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">데이터셋별 모델 평가 기록</title>
  <desc id="desc">데이터셋별 모델 평가 기록입니다. 초기 검증셋 225개에서 규칙 단독, C1, C2, 규칙+C3, 규칙+C1→C3, C3 단독의 정답률은 각각 43.56%, 71.56%, 71.11%, 72.89%, 73.78%, 75.11%입니다. 9월 5일 Notion의 Gold v2 144개 기록에서 Rules v3, C1-G, 규칙+C1-G, 당시 C3의 정답률은 57.6%, 72.2%, 72.2%, 94.4%입니다. 9월 16일 새 기준 205개에서 당시 C3, v16, 새 FP32 후보와 근거 정책, 같은 후보의 FP16 저장/FP32 연산과 근거 정책은 각각 59.51%, 74.15%, 81.95%, 81.95%입니다. 이 후보는 고정 4426 모델이며 9월 16일 서비스에 반영됐습니다. 9월 20일 출시한 현재 C3 v2 epoch3와 고정 정책은 최신 고정 205개에서 165개 정답, 정답률 80.49%입니다. Gold v2는 평가셋 이름, C1-G는 경량 분류 모델, v16은 학습량 조정 후보, 4426은 개선 모델 식별값입니다. FP32·FP16은 가중치 저장 방식이고 정책은 AI 판정을 보정하는 규칙입니다. 평가셋이 달라 구역 간 점수를 직접 비교할 수 없습니다. 수치와 막대 길이는 고정하고, 강조 배경을 01·02·03 순서로 채운 뒤 현재 점수를 한 번 강조합니다. 모션 감소 설정에서는 정적으로 표시합니다.</desc>
  <style>
