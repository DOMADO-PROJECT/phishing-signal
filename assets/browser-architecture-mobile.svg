    <text id="header-brand" x="64" y="47" font-size="21" fill="#101828" font-weight="750">피싱 신호등</text>
    <text id="header-page" x="186" y="45" font-size="12.5" fill="#2563D9" font-weight="650" style="letter-spacing:0.5px">ARCHITECTURE</text>
    <text id="header-detail" x="416" y="45" font-size="13" fill="#596779" text-anchor="end">브라우저 분석 구조</text>
    <path d="M24 80H416" fill="none" stroke="#E3E8EF" stroke-width="1"/>
  </g>
