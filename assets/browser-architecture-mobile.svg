<svg xmlns="http://www.w3.org/2000/svg" width="440" height="880" viewBox="0 0 440 880" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">브라우저 안에서 분석</title>
  <desc id="desc">연락 원문과 행동 확인 답변은 사용자 브라우저 안에서 처리합니다. 입력·결과 화면은 토큰화, 규칙 보정과 행동 확인을 담당하며 ONNX Runtime Web은 Web Worker와 WASM으로 모델을 실행합니다. Cloudflare R2에서 약 223MB 모델을 내려받고 같은 탭에서는 준비된 모델을 재사용합니다. Supabase의 사례 조회·참여는 별도 외부 통신입니다. 연락 원문과 답변을 외부 AI 추론 API에 보내지 않습니다. 모델 전달을 나타내는 점, 연산 표시, 결과 카드 강조를 10초 주기로 반복합니다. Supabase 카드는 고정하고 사례 통신의 양방향 점선이 계속 흐릅니다. 모션은 처리 흐름을 설명하기 위한 반복입니다. 실제 다운로드 횟수, 실행 시간이나 모든 네트워크 요청을 뜻하지 않습니다. 모션 감소 시 정적으로 표시됩니다.</desc>
  <style>
    text{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;letter-spacing:-.35px}
    .numeric{font-variant-numeric:tabular-nums;letter-spacing:-1px}
    .wire-motion,.wire-head,.download-packet{opacity:0}
    .wire-motion{transform-box:fill-box;transform-origin:left center}
    .vertical{transform-origin:center top}.vertical.reverse-y{transform-origin:center bottom}.reverse{transform-origin:right center}
    @media(prefers-reduced-motion:no-preference){
      .wire-motion{animation:connect 10s linear infinite both;animation-delay:var(--delay,0s)}
      .wire-motion.vertical{animation-name:connect-down}
      .wire-head{animation:arrive-head 10s linear infinite both;animation-delay:var(--delay,0s)}
      .flow-card{animation:receive 10s ease-out infinite;animation-delay:var(--delay,0s)}
      .flow-card>rect{animation:receive-surface 10s ease-out infinite;animation-delay:var(--delay,0s)}
      .download-packet{animation:download 10s linear infinite both;animation-delay:var(--delay,0s)}
      .compute-dot{animation:compute 10s ease-in-out infinite;animation-delay:var(--delay,0s)}
      .cases-wire{animation:dash-flow .9s linear infinite}
    }
    @keyframes connect{0%{opacity:0;transform:scaleX(.04)}1%{opacity:1}10%,20%{opacity:1;transform:scaleX(1)}25%,100%{opacity:0;transform:scaleX(1)}}
    @keyframes connect-down{0%{opacity:0;transform:scaleY(.04)}1%{opacity:1}10%,20%{opacity:1;transform:scaleY(1)}25%,100%{opacity:0;transform:scaleY(1)}}
    @keyframes arrive-head{0%,9%,25%,100%{opacity:0}10%,20%{opacity:1}}
    @keyframes receive{0%,28%,100%{transform:translateY(0)}6%,18%{transform:translateY(-2px)}}
    @keyframes receive-surface{0%,28%,100%{fill:var(--surface,#FFF)}6%,18%{fill:#E5EEFF}}
    @keyframes download{0%,3%{opacity:0;transform:translate(0,0)}5%{opacity:1}17%{opacity:1;transform:translate(var(--travel-x),var(--travel-y))}20%,100%{opacity:0;transform:translate(var(--travel-x),var(--travel-y))}}
    @keyframes compute{0%,30%,50%,100%{fill:#BBD0F6;transform:translateY(0)}35%,43%{fill:#2563D9;transform:translateY(-3px)}}
    @keyframes dash-flow{to{stroke-dashoffset:-9}}
  </style>
  <rect width="440" height="880" rx="14" fill="#FFF"/>
  <g id="diagram-header">
    <g transform="translate(24 25) scale(0.875)" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#101828"/><rect x="11" y="5" width="10" height="22" rx="5" fill="#FFF"/><circle cx="16" cy="10" r="2.7" fill="#F04438"/><circle cx="16" cy="16" r="2.7" fill="#FFAB16"/><circle cx="16" cy="22" r="2.7" fill="#19B980"/></g>
    <text id="header-brand" x="64" y="47" font-size="21" fill="#101828" font-weight="750">피싱 신호등</text>
    <text id="header-page" x="186" y="45" font-size="12.5" fill="#2563D9" font-weight="650" style="letter-spacing:0.5px">ARCHITECTURE</text>
    <text id="header-detail" x="416" y="45" font-size="13" fill="#596779" text-anchor="end">브라우저 분석 구조</text>
    <path d="M24 80H416" fill="none" stroke="#E3E8EF" stroke-width="1"/>
  </g>
