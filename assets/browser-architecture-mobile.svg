  <path d="M250 396L250 346M245 353L250 346L255 353" fill="none" stroke="#AAB7C7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="249" y="346" width="2" height="50" rx="0" fill="#2563D9" class="wire-motion vertical reverse-y" style="--delay:5s" aria-hidden="true"/><path d="M245 353L250 346L255 353" fill="none" stroke="#2563D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="wire-head" style="--delay:5s" aria-hidden="true"/>
  <text x="153" y="378" font-size="18" fill="#596779" font-weight="400" text-anchor="middle">입력</text>
  <text x="287" y="378" font-size="18" fill="#596779" font-weight="400" text-anchor="middle">결과</text>
  <path d="M220 602L220 572M215 579L220 572L225 579" fill="none" stroke="#AAB7C7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="219" y="572" width="2" height="30" rx="0" fill="#2563D9" class="wire-motion vertical reverse-y" style="--delay:0s" aria-hidden="true"/><path d="M215 579L220 572L225 579" fill="none" stroke="#2563D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="wire-head" style="--delay:0s" aria-hidden="true"/>
  <g fill="#2563D9" style="--travel-x:0px;--travel-y:-18px" aria-hidden="true"><circle cx="220" cy="596" r="3" class="download-packet"/><circle cx="220" cy="596" r="3" class="download-packet" style="--delay:.35s"/><circle cx="220" cy="596" r="3" class="download-packet" style="--delay:.7s"/></g>
  <g class="flow-card" style="--surface:#F5F8FC">
  <rect id="model-card" x="24" y="610" width="392" height="112" rx="10" fill="#F5F8FC"/>
  <g id="model-copy" text-anchor="middle"><text x="220" y="646" font-size="24" fill="#101828" font-weight="650">Cloudflare R2</text><text x="220" y="674" font-size="19" fill="#596779" font-weight="400">모델 다운로드 · 약 223MB</text><text x="220" y="704" font-size="16" fill="#2563D9" font-weight="500">첫 분석 시 준비 · 같은 탭에서 재사용</text></g>
  </g>
  <rect id="cases-card" x="24" y="738" width="392" height="112" rx="10" fill="#F5F8FC"/>
  <g id="cases-copy" text-anchor="middle"><text x="220" y="774" font-size="24" fill="#101828" font-weight="650">Supabase</text><text x="220" y="802" font-size="19" fill="#596779" font-weight="400">사례 조회 · 참여</text><text x="220" y="832" font-size="16" fill="#596779" font-weight="400">연락 분석과 별도 통신</text></g>
  <path d="M24 544H12V774H14" fill="none" stroke="#AAB7C7" stroke-width="1.6" stroke-dasharray="4 5" stroke-linecap="round" stroke-linejoin="round" class="cases-wire"/><path d="M17 769L24 774L17 779" fill="none" stroke="#AAB7C7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M416 802H428V544H426" fill="none" stroke="#AAB7C7" stroke-width="1.6" stroke-dasharray="4 5" stroke-linecap="round" stroke-linejoin="round" class="cases-wire"/><path d="M423 539L416 544L423 549" fill="none" stroke="#AAB7C7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
