  </g>
  <g class="flow-card" style="--delay:2.6s">
  <rect id="runtime-card" x="48" y="404" width="344" height="116" rx="10" fill="#FFF"/>
  <g id="runtime-copy" text-anchor="middle"><text x="220" y="452.14" font-size="25" fill="#101828" font-weight="650">ONNX Runtime Web</text><text x="220" y="488.14" font-size="21" fill="#2563D9" font-weight="500">Web Worker · WASM</text></g>
  <g fill="#BBD0F6" aria-hidden="true"><circle cx="204" cy="508" r="3" class="compute-dot" style="--delay:0s"/><circle cx="220" cy="508" r="3" class="compute-dot" style="--delay:.2s"/><circle cx="236" cy="508" r="3" class="compute-dot" style="--delay:.4s"/></g>
  </g>
