    <text id="header-brand" x="86" y="53" font-size="28" fill="#101828" font-weight="750">피싱 신호등</text>
    <text id="header-page" x="250" y="51" font-size="16" fill="#2563D9" font-weight="650" style="letter-spacing:1px">ARCHITECTURE</text>
    <text id="header-detail" x="1240" y="51" font-size="16" fill="#596779" text-anchor="end">브라우저 안팎의 처리와 통신</text>
    <path d="M40 80H1240" fill="none" stroke="#E3E8EF" stroke-width="1"/>
